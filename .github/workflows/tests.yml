name: Clinical Co-Pilot unit tests

# NOT currently auto-triggered on push -- see ERROR_ANALYSIS.md's
# "GitHub Actions cannot reach the droplet" entry (2026-09-16). GitHub's
# runners can't reach the droplet's OpenEMR on either port (confirmed not a
# TLS/cert issue, not ufw, not a DO Cloud Firewall -- something upstream of
# the droplet), so an auto-triggered run here would just fail every push.
# Until that's resolved (self-hosted runner on the droplet is the leading
# option), this suite is manually run (`python3 -m evals.unit_tests`) or
# manually dispatched here via workflow_dispatch, same as the 8 LLM-based
# eval cases in evals/cases.py already are (those additionally cost real
# Anthropic API spend per run, so stay manual regardless -- see
# clinical-copilot/evals/COVERAGE.md's "two-tier testing strategy" section).

on:
  workflow_dispatch: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinical-copilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LLM-free unit tests
        env:
          OPENEMR_BASE_URL: ${{ secrets.OPENEMR_BASE_URL }}
          OPENEMR_OAUTH_CLIENT_ID: ${{ secrets.OPENEMR_OAUTH_CLIENT_ID }}
          OPENEMR_OAUTH_CLIENT_SECRET: ${{ secrets.OPENEMR_OAUTH_CLIENT_SECRET }}
          OPENEMR_OAUTH_USERNAME: ${{ secrets.OPENEMR_OAUTH_USERNAME }}
          OPENEMR_OAUTH_PASSWORD: ${{ secrets.OPENEMR_OAUTH_PASSWORD }}
          OPENEMR_VERIFY_TLS: "false"
          # Unused by unit_tests.py (no Anthropic calls in this suite) but
          # required by app/config.py's Settings validation.
          ANTHROPIC_API_KEY: "unused-in-unit-tests"
        run: python3 -m evals.unit_tests
